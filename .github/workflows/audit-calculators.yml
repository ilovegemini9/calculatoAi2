name: Calculator Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/calculator-platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/calculator-platform/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm audit
      - run: pnpm test -- --test-reporter=spec
