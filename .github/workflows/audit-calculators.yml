name: Calculator Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/calculator-platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: artifacts/calculator-platform/package.json
      - run: pnpm install --no-frozen-lockfile
      # Keep the complete advisory report visible. The braces finding is in the
      # development-only ESLint toolchain and has no upstream patched release yet.
      - name: Full dependency audit (informational)
        run: pnpm audit
        continue-on-error: true
      # Production dependencies remain a blocking security gate.
      - name: Production dependency audit
        run: pnpm audit --prod
      - run: pnpm test -- --test-reporter=spec
